```
spec:
  containers:
    - name: backend

      image: dinesh3715/csts-backend:latest

      ports:
        - containerPort: 8000

      env:
        - name: DEBUG
          value: "False"

        - name: SECRET_KEY
          value: "django-insecure-csts-project-secret-key"

        - name: ALLOWED_HOSTS
          value: "localhost,127.0.0.1,*"

        - name: DB_NAME
          value: "csts_db"

        - name: DB_USER
          value: "postgres"

        - name: DB_PASSWORD
          value: "postgres"

        - name: DB_HOST
          value: "postgres"

        - name: DB_PORT
          value: "5432"

